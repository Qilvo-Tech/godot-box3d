name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmake-generator: Ninja
          - os: macos-latest
            cmake-generator: Ninja

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Configure
        if: runner.os != 'macOS'
        run: cmake -B build -G "${{ matrix.cmake-generator }}"

      - name: Configure universal binary (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -G "${{ matrix.cmake-generator }}" '-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64'

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: godot-box3d-${{ runner.os }}
          path: bin/

  build-linux:
    runs-on: ubuntu-latest
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk@sha256:1c33c507bc75d012e77df5727f93b0d5b8c3f7c8d4142ba5f7a16882cc92e014

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Trust container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl ninja-build unzip

      - name: Configure
        run: cmake -B build -G Ninja

      - name: Build
        run: cmake --build build --parallel

      - name: Install Godot
        shell: bash
        env:
          GODOT_VERSION: 4.7-stable
          GODOT_ZIP_NAME: Godot_v4.7-stable_linux.x86_64
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 \
            -o "$RUNNER_TEMP/${GODOT_ZIP_NAME}.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ZIP_NAME}.zip"
          unzip -o "$RUNNER_TEMP/${GODOT_ZIP_NAME}.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/${GODOT_ZIP_NAME}"

      - name: Run headless tests
        shell: bash
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.7-stable_linux.x86_64
          TEST_SUMMARY: ${{ runner.temp }}/test-summary.md
        run: scripts/run_headless_tests.sh

      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/test-summary.md" ]]; then
            cat "$RUNNER_TEMP/test-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Tests did not run' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: godot-box3d-Linux
          path: bin/

  web:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: nothreads
            threads: 'OFF'
          - variant: threads
            threads: 'ON'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.11
          actions-cache-folder: emsdk-cache

      - name: Configure
        run: >-
          emcmake cmake
          -B build-web-${{ matrix.variant }}
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGODOT_BOX3D_WEB_THREADS=${{ matrix.threads }}

      - name: Build
        run: cmake --build build-web-${{ matrix.variant }} --parallel 2

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: godot-box3d-Web-${{ matrix.variant }}
          path: bin/libgodot-box3d.web.release.wasm32.${{ matrix.variant }}.wasm

  release:
    needs: [build, build-linux, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Filenames differ per platform/ABI, so all artifacts flatten into one bin/ cleanly.
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: godot-box3d-*
          merge-multiple: true
          path: bin

      - name: Assemble addon
        run: |
          mkdir -p addon/addons/godot-box3d/bin
          cp test_project/addons/godot-box3d/godot-box3d.gdextension addon/addons/godot-box3d/
          cp LICENSE addon/addons/godot-box3d/
          cp bin/libgodot-box3d.so bin/godot-box3d.dll bin/libgodot-box3d.dylib \
            addon/addons/godot-box3d/bin/
          cp bin/libgodot-box3d.web.release.wasm32.*.wasm addon/addons/godot-box3d/bin/
          cd addon && zip -r ../godot-box3d-${{ github.ref_name }}.zip addons

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: godot-box3d-${{ github.ref_name }}.zip
          generate_release_notes: true
